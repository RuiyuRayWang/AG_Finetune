# AlphaGenome Fine-tuning Configuration — Hybrid Head+LoRA, Quick 3-epoch run
#
# Identical to config_bigwig_hybrid.yaml except:
#   epochs: 3  (1 freeze + 2 LoRA)
#   Expected wall time: ~45 min
#
# Checkpoints are saved with jax.device_get() → plain numpy, no NamedSharding.
# Load with CUDA_VISIBLE_DEVICES=0 in the evaluation notebook (no LD_PRELOAD
# needed, no NCCL, single-GPU inference).
#
# Usage:
#   LD_PRELOAD=/home/ray/miniforge3/envs/alphagenome/lib/python3.11/site-packages/nvidia/nccl/lib/libnccl.so.2 \
#       python scripts/tf_ft_hybrid.py --config configs/config_bigwig_hybrid_quick.yaml


# PATHS (Required)
checkpoint: /home/ray/AG_Finetune/checkpoints/pre_trained/alphagenome-all-folds
fasta: /home/ray/AG_Finetune/data/resources/mm10.fa

## Input: Genome track signals in bigwig format.
# signal: /home/ray/AG_Finetune/data/CUTTag/processed_bigwig/GPe-PV_H3K27ac_averaged_normalized.bigwig  # backwards compatibility
signals: 
  - /home/ray/AG_Finetune/data/CUTTag/processed_bigwig/GPe-PV_H3K27ac_averaged_normalized.bigwig
  - /home/ray/AG_Finetune/data/CUTTag/processed_bigwig/GPe-PV_H3K27me3_averaged_normalized.bigwig
output: /home/ray/AG_Finetune/checkpoints/fine_tuned

## Required when windows_bed is omitted (whole-genome mode)
chrom_sizes: /home/ray/AG_Finetune/data/resources/mm10.chrom.sizes


# PRECISION
precision_policy: params=float32,compute=float32,output=float32


# TRAINING HYPERPARAMETERS
epochs: 3
freeze_epochs: 1        # Phase 1: 1 epoch head-only (~6.5 min)
                        # Phase 2: 2 epochs head+LoRA (~38 min)
batch_size: 4
learning_rate: 5e-4     # Peak LR used in both phases
weight_decay: 0.04      # AdamW weight decay (paper pre-training: 0.4, distillation: 0.04)
checkpoint_interval: 0    # Mid-epoch crash-recovery saves. Disabled: no resume logic exists, so these are never used.


# LORA CONFIGURATION (Phase 2)
lora_rank: 16
lora_alpha: 32.0


# DATA & AUGMENTATION
window_size: 8192       # 2^13 bp — covers AAV genome (~4.7 kb) with ~1.75 kb flanking on each side
organism_id: 1          # mouse
augment: true
max_shift: 256


# CHROMOSOME SPLITS (mm10)
# Chromosomes held out for validation (used for early stopping / best checkpoint selection)
val_chroms:
  - chr7
# Chromosomes held out for testing (never seen during training — for final evaluation only)
test_chroms:
  - chr8
  - chr9


# SYSTEM
num_workers: 0