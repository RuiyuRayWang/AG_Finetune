# AlphaGenome Fine-tuning Configuration — Hybrid Head+LoRA Curriculum
#
# Two-phase training strategy implemented in tf_ft_hybrid.py:
#
#   Phase 1  (first `freeze_epochs` epochs)  — Head only
#     Trunk is fully frozen.  Only the new ATAC head (~9 K params) is
#     optimised.  Per-step time: ~0.15 s.  Loss converges quickly.
#
#   Phase 2  (remaining epochs)  — Head + LoRA
#     Trunk base weights stay frozen.  Low-rank A/B matrices are added to
#     the Q/K/V projections of all 9 transformer blocks (~428 K params at
#     rank 8) and trained jointly with the head.  Trunk is never mutated
#     directly — LoRA deltas are merged only at save/inference time.
#     Per-step time is intermediate; far fewer params than full training.
#
# Usage:
#   LD_PRELOAD=/home/ray/miniforge3/envs/alphagenome/lib/python3.11/site-packages/nvidia/nccl/lib/libnccl.so.2 \
#       python scripts/tf_ft_hybrid.py --config configs/config_bigwig_hybrid.yaml


# PATHS (Required)
checkpoint: /home/ray/AG_Finetune/checkpoints/pre_trained/alphagenome-all-folds
fasta: /home/ray/AG_Finetune/data/resources/mm10.fa
signals: 
  - /home/ray/AG_Finetune/data/CUTTag/processed_bigwig/GPe-PV_H3K27ac_averaged_normalized.bigwig
  - /home/ray/AG_Finetune/data/CUTTag/processed_bigwig/GPe-PV_H3K27me3_averaged_normalized.bigwig
  
output: /home/ray/AG_Finetune/checkpoints/fine_tuned

## Optional: BED file with specific genomic windows to use for training
## If not provided, non-overlapping windows are generated from chrom_sizes (whole-genome mode)
windows_bed:
# windows_bed: /home/ray/AG_Finetune/exports/peak_safe_windows/D1MSN_H3K27ac_merged_peak_safe_windows.bed  # Disabled

## Required when windows_bed is omitted (whole-genome mode)
chrom_sizes: /home/ray/AG_Finetune/data/resources/mm10.chrom.sizes


# PRECISION
precision_policy: params=float32,compute=float32,output=float32


# TRAINING HYPERPARAMETERS
epochs: 200
freeze_epochs: 10        # Phase 1 length: epochs to keep trunk fully frozen
batch_size: 4
learning_rate: 3e-4     # Peak LR used in both phases
weight_decay: 0.04      # AdamW weight decay (paper pre-training: 0.4, distillation: 0.04)
checkpoint_epoch_interval: 10  # Save epoch_NNN every N epochs (0 disables epoch snapshots; best checkpoint still saved).


# LORA CONFIGURATION (Phase 2)
lora_rank: 32           # LoRA rank — increase to 32/64 if Phase 2 plateaus early
lora_alpha: 64.0        # LoRA alpha scaling factor (effective LR = alpha/rank = 2.0)
lora_init_std: 0.02     # Init std for both A and B matrices (symmetric N(0, 0.02) init)


# DATA & AUGMENTATION
# window_size: 8192       # 2^13 bp — covers AAV genome (~4.7 kb) with ~1.75 kb flanking on each side
window_size: 65536       # 2^16 bp — covers AAV genome (~4.7 kb) with ~31.25 kb flanking on each side
organism_id: 1          # 0=human, 1=mouse
augment: true
max_shift: 1024


# CHROMOSOME SPLITS (mm10)
# Chromosomes held out for validation (used for early stopping / best checkpoint selection)
val_chroms:
  - chr7
# Chromosomes held out for testing (never seen during training — for final evaluation only)
test_chroms:
  - chr8
  - chr9


# SYSTEM
num_workers: 0
