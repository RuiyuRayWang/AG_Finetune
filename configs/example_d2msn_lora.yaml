# Example: D2MSN H3K27ac Fine-tuning with LoRA
# 
# This is an example configuration for parameter-efficient fine-tuning using
# LoRA on D2 MSN CUT&Tag H3K27ac data.
#
# Usage:
#   python scripts/train.py --config configs/example_d2msn_lora.yaml

# ============================================================================
# STRATEGY
# ============================================================================
strategy: lora  # Parameter-efficient LoRA fine-tuning
precision_policy: params=float32,compute=float32,output=float32

# ============================================================================
# PATHS
# ============================================================================
checkpoint: /home/ray/AG_Finetune/checkpoints/pre_trained/alphagenome-all-folds
fasta: /home/ray/AG_Finetune/data/resources/mm10.fa
signal: /home/ray/AG_Finetune/data/CUTTag/processed_bedgraph/D2MSN_H3K27ac_averaged_normalized.bedgraph
output: /home/ray/AG_Finetune/checkpoints/fine_tuned_d2msn_lora_r8

windows_bed: /home/ray/AG_Finetune/exports/peak_safe_windows/D2MSN_H3K27ac_merged_peak_safe_windows.bed

# ============================================================================
# TRAINING HYPERPARAMETERS
# ============================================================================
epochs: 20  # LoRA typically trains longer
batch_size: 8
learning_rate: 1e-5  # Lower LR for LoRA (more conservative)

# ============================================================================
# LORA CONFIGURATION
# ============================================================================
lora_rank: 8  # Low rank for parameter efficiency (~428K trainable params)
lora_alpha: 16.0  # Scaling factor (2x rank is typical)

# ============================================================================
# DATA & AUGMENTATION
# ============================================================================
window_size: 131072  # 2^17 bp
organism_id: 1  # Mouse

augment: true
max_shift: 1024

# ============================================================================
# SYSTEM
# ============================================================================
num_workers: 0
