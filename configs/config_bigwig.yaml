# AlphaGenome Fine-tuning Configuration Template
# 
# This config file contains all hyperparameters, paths, and settings for fine-tuning.
# Copy this template and modify for your specific training run.
#
# Usage:
#   python scripts/train.py --config configs/my_experiment.yaml
#
# Note: Command-line arguments will override values in this config file.


# STRATEGY
strategy: head_replace  # Options: 'head_replace' (default, recommended) or 'lora'
precision_policy: params=float32,compute=float32,output=float32  # Full float32 (stable)


# PATHS (Required)
## Path to pre-trained AlphaGenome checkpoint
checkpoint: /home/ray/AG_Finetune/checkpoints/pre_trained/alphagenome-all-folds

## Path to reference genome FASTA
fasta: /home/ray/AG_Finetune/data/resources/mm10.fa

## Path to CUT&Tag signal file (BedGraph or BigWig, base-pair resolution, normalized to 100M)
signal: /home/ray/AG_Finetune/data/CUTTag/ZHY-250227-1/ZHY-250227-1_ACTGCATATAAGGCGA/alignment/bigwig/ZHY-250227-1_ACTGCATATAAGGCGA_bowtie2.chrombpnet_reads_to_bw_unstranded.bw

## Output directory for checkpoints and logs
output: /home/ray/AG_Finetune/checkpoints/fine_tuned

## Optional: BED file with specific genomic windows to use for training
## STRONGLY RECOMMENDED: Use safe windows to avoid hypersensitive artifact regions
## If not provided, windows will be sampled from valid regions (may include artifacts)
windows_bed: /home/ray/AG_Finetune/exports/peak_safe_windows/D1MSN_H3K27ac_merged_peak_safe_windows.bed


# TRAINING HYPERPARAMETERS
epochs: 10
batch_size: 8  # Total batch size across all GPUs
learning_rate: 5e-4  # Peak learning rate (5e-4 for head_replace, 1e-5 for lora)


# LORA CONFIGURATION (only used when strategy='lora')
lora_rank: 8
lora_alpha: 16.0


# DATA & AUGMENTATION
window_size: 131072  # Sequence window size in bp (must be divisible by 128)
                     # AlphaGenome pretrained on 1,048,576 bp (2^20)
                     # Fine-tuning typically uses 131,072 bp (2^17)

organism_id: 1  # 0=human, 1=mouse

## Data augmentation (following AlphaGenome pretraining protocol)
augment: true       # Enable/disable augmentation
max_shift: 1024     # Random shift range (±bp) for shift augmentation


# SYSTEM
num_workers: 0  # Number of DataLoader workers (0 = main process only)


# NOTES
# - CUT&Tag is conceptually similar to ATAC-seq (both use Tn5 enzyme)
#   → Use the ATAC prediction head at base-pair resolution
# - Signal should be base-pair resolution, normalized to 100M total insertions
# - Pass raw counts; loss function applies baskerville_target_transform internally
# - Window size must be divisible by 128
# - Multi-GPU: parameters are replicated, batch dimension is sharded
